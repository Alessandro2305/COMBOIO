<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>COMBOIO UST</title>
</head>

<body>

    <div class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Usina santa terezinha">
            <div class="logo-info">
                <h1>LUBRI-GESTÃO</h1>
                <p>Gestão de Lubrificantes</p>
            </div>
        </div>

        <div class="caixa">

            <div class="caixa-info">
                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-house-user"></i>
                        <label for="filial">FILIAL</label>
                    </div>
                    <select name="filial" id="filial">
                        <option value="">Selecione...</option>
                        <option value="15">Rondon</option>
                        <option value="16">Cidade Gaúcha</option>
                    </select>
                </div>

                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-house-user"></i>
                        <label for="unidade">UNIDADE</label>
                    </div>
                    <input type="number" id="unidade" name="unidade" placeholder="UNIDADE" disabled>
                </div>
            </div>

            <div class="caixa-info">

                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-truck"></i>
                        <label for="frota" id="frota">FROTA</label>
                    </div>
                    <input type="number" id="frota" name="frota" placeholder="Nº DO COMBOIO" required>
                </div>
                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-file"></i>
                        <label for="deposito" id="deposito">DEPOSITO</label>
                    </div>
                    <input type="number" id="deposito" name="deposito" placeholder="Ex: 20" required>
                </div>

            </div>

            <div class="caixa-info01">
                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-truck"></i>
                        <label for="cracha" id="cracha">Cracha</label>
                    </div>
                    <input type="number" id="cracha" name="cracha" placeholder="Nº DO CRACHA" required>
                </div>
                <div class="select">
                    <div class="box">
                        <i class="fa-solid fa-truck"></i>
                        <label for="nome" id="nome">Nome</label>
                    </div>
                    <input type="number" id="nome" name="nome" placeholder="NOME" disabled required>
                </div>
            </div>

            <div class="btn">
                <button type="submit">ENTRAR</button>
            </div>

            <div class="btn-sair">
                <button type="submit">SAIR</button>
            </div>

            <p>© 2026 Usina Santa Terezinha | Gestão de Estoque</p>

            <h2>Versão 1.0.01</h2>

        </div>


    </div>

    <script src="script.js"></script>

</body>

</html>
